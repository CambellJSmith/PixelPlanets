name: Materialize Godot Port

on:
  push:
    branches:
      - godot-port

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Materialize Port Payload
        shell: bash
        run: |
          if ! compgen -G '.port_payload/part_*' > /dev/null; then
            echo 'No port payload to materialize.'
            exit 0
          fi
          cat .port_payload/part_* > /tmp/pixelplanets-port.b64
          base64 --decode /tmp/pixelplanets-port.b64 > /tmp/pixelplanets-port.tar.xz
          tar -xJf /tmp/pixelplanets-port.tar.xz -C .
          rm -rf .port_payload
          rm -f .github/workflows/materialize-godot-port.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Materialize complete Godot port'
          git push origin HEAD:godot-port

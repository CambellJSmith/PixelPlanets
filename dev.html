<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Infinite Pixel World — Development</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="game-shell">
    <canvas id="game" width="360" height="210" aria-label="Infinite procedural pixel world development build."></canvas>
    <div id="boot-status" class="boot-status" role="status" aria-live="assertive">LOADING MODULE BUILD...</div>
    <div id="accessibility-status" class="sr-only" aria-live="polite"></div>
  </main>

  <script>
    window.addEventListener('error',event=>{
      const status=document.getElementById('boot-status');
      if(!status)return;
      status.hidden=false;
      status.classList.add('boot-error');
      status.textContent='GAME FAILED TO START: '+(event.error?.message||event.message||'UNKNOWN ERROR');
    });
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
